server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output never changes, so it can be cached for a long time.
    location ~* \.(?:js|css|woff2?|ttf|ico|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Translations are not hashed, so browsers must revalidate them.
    location /i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /config.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-side routes such as /airlines/new resolve to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
